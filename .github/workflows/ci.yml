name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          # src/instrumentation.ts calls validateEnv() at startup and throws when a
          # required variable is missing, which `next build` can trigger. These are
          # syntactically valid dummies — no real credentials belong in CI.
          NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
          SUPABASE_SERVICE_ROLE_KEY: dummy-service-role-key
          CRON_SECRET: dummy-cron-secret

  migrations:
    name: migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Pinned deliberately. This job is a REQUIRED status check, so `latest` would let an
      # upstream CLI release change reset semantics and turn every pull request red with no
      # change on our side — blocking all merges until someone traced it to a third party.
      # Bump this on purpose, in its own pull request.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.110.0

      # The baseline migration depends on the Supabase stack — auth.users, auth.uid(),
      # auth.role() and the anon/authenticated/service_role roles. A plain postgres
      # container cannot replay it; it must be a real local Supabase instance.
      - name: Start the local Supabase stack
        run: supabase start

      # --local is explicit and load-bearing: `supabase db reset --linked` would reset a
      # REMOTE project. Never remove it.
      # Seeding is deliberately NOT skipped. supabase/seed.sql is part of the onboarding
      # path, so a broken seed would otherwise surface only when a new developer runs
      # `supabase db reset` for the first time — the exact moment this job exists to protect.
      # DIAGNOSTIC: --sql-paths force-enables seeding for this reset even though
      # config.toml has it disabled. Distinguishes "the CLI cannot seed this file at all"
      # from "the CLI cannot seed during `start`, when the stack is still coming up".
      - name: Rebuild the schema and load the seed via the CLI
        run: supabase db reset --local --sql-paths ./seed.sql

      - name: Stop the local Supabase stack
        if: always()
        run: supabase stop
